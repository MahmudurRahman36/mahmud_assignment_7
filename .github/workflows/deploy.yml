name: Deploy to AWS 3-Tier Architecture

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DEPLOY_PATH: /home/ubuntu/bmi-health-tracker
  FRONTEND_DEPLOY_PATH: /var/www/html
  DB_NAME: bmidb
  DB_USER: bmi_user
  NODE_VERSION: '18.x'

jobs:
  deploy:
    name: Build & Deploy via Bastion Host
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH Agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

    - name: Configure SSH to skip host key checking
      run: |
        mkdir -p ~/.ssh
        cat >> ~/.ssh/config <<EOF
        Host *
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
        EOF
        chmod 600 ~/.ssh/config

    - name: Verify SSH Connectivity to Bastion Host
      run: |
        echo "Testing SSH connection to Bastion Host..."
        ssh ubuntu@${{ secrets.EC2_BASTION_HOST }} "echo 'Connected successfully to Bastion Host!'"

    - name: Deploy Backend (Private Subnet)
      run: |
        echo "=========================================="
        echo "Deploying Backend EC2 via Bastion Host"
        echo "=========================================="
        
        ssh -J ubuntu@${{ secrets.EC2_BASTION_HOST }} ubuntu@${{ secrets.EC2_BACKEND_HOST }} << 'ENDSSH'
          # ── STEP 1: Load paths ────────────────────────────────────────────
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" || true
          export PM2_HOME=/home/ubuntu/.pm2
          export APP_DIR=/home/ubuntu/bmi-health-tracker

          # ── STEP 2: Pull latest code ──────────────────────────────────────
          echo "==> Syncing latest code..."
          if [ ! -d "$APP_DIR/.git" ]; then
            git clone https://github.com/${{ github.repository }}.git $APP_DIR
          else
            cd $APP_DIR
            git remote set-url origin https://github.com/${{ github.repository }}.git || true
            git fetch origin
            git reset --hard origin/main
            git clean -fd
          fi
          sudo chown -R ubuntu:ubuntu $APP_DIR

          # ── STEP 3: Install dependencies ──────────────────────────────────
          echo "==> Installing Node dependencies..."
          cd $APP_DIR/src/backend
          npm install --production 2>&1 | tail -5

          # ── STEP 4: Write .env — smart credential resolution ──────────────
          # The old backend ran from /backend/ (no src/). Its .env had the
          # CORRECT PostgreSQL password. The DB_PASSWORD GitHub secret may
          # not match the actual DB password set during manual provisioning.
          # Strategy: reuse DATABASE_URL from old working .env; fall back to
          # GitHub secrets only if the old .env is absent.
          echo "==> Resolving database credentials..."
          OLD_ENV=/home/ubuntu/bmi-health-tracker/backend/.env
          NEW_ENV=$APP_DIR/src/backend/.env

          # Always write the non-secret parts fresh
          printf 'NODE_ENV=production\n'  > $NEW_ENV
          printf 'PORT=3000\n'           >> $NEW_ENV
          printf 'FRONTEND_URL=http://${{ secrets.ALB_DNS_NAME }}\n' >> $NEW_ENV

          # Prefer the existing (working) DATABASE_URL from old .env
          if [ -f "$OLD_ENV" ] && grep -q "DATABASE_URL" "$OLD_ENV"; then
            echo "==> Reusing DATABASE_URL from existing $OLD_ENV"
            grep "^DATABASE_URL" "$OLD_ENV" >> $NEW_ENV
          else
            echo "==> Writing DATABASE_URL from GitHub secrets (fallback)"
            printf 'DATABASE_URL=postgresql://${{ env.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_PRIVATE_IP }}:5432/${{ env.DB_NAME }}\n' >> $NEW_ENV
          fi
          chmod 600 $NEW_ENV

          # Show masked URL for diagnostics
          DB_URL=$(grep "^DATABASE_URL" $NEW_ENV | head -1)
          echo "==> DB_URL: $(echo $DB_URL | sed 's|:.*@|:****@|')"

          # ── STEP 5: Test DB connection + create measurements table ────────
          echo "==> Testing DB connection and running migration..."
          node -e "
            const { Pool } = require('pg');
            require('dotenv').config({ path: '$NEW_ENV' });
            if (!process.env.DATABASE_URL) { console.log('ERROR: DATABASE_URL not set'); process.exit(0); }
            const pool = new Pool({ connectionString: process.env.DATABASE_URL, connectionTimeoutMillis: 8000 });
            pool.connect(function(connErr, client, done) {
              if (connErr) {
                console.log('DB-CONNECT-ERROR: ' + connErr.message);
                console.log('HINT: Update DB_PASSWORD secret or fix old .env password');
                pool.end(); process.exit(0);
              }
              console.log('DB-CONNECT-OK');
              client.query('CREATE TABLE IF NOT EXISTS measurements (id SERIAL PRIMARY KEY, weight_kg NUMERIC(5,2) NOT NULL, height_cm NUMERIC(5,2) NOT NULL, age INTEGER NOT NULL, sex VARCHAR(10) NOT NULL, activity_level VARCHAR(30), bmi NUMERIC(4,1) NOT NULL, bmi_category VARCHAR(30), bmr INTEGER, daily_calories INTEGER, measurement_date DATE NOT NULL DEFAULT CURRENT_DATE, created_at TIMESTAMPTZ NOT NULL DEFAULT now())', function(qErr) {
                done();
                if (qErr) { console.log('TABLE-WARN: ' + qErr.message); } else { console.log('TABLE-OK: measurements ready'); }
                pool.end(); process.exit(0);
              });
            });
          " || true

          # ── STEP 6: Kill PM2 daemon completely and restart fresh ───────────
          echo "==> Force-restarting PM2..."
          pm2 kill 2>/dev/null || true
          sleep 2
          cd $APP_DIR/src/backend
          pm2 start ecosystem.config.js --env production
          pm2 save
          pm2 startup systemd -u ubuntu --hp /home/ubuntu 2>/dev/null | grep 'sudo env' | bash || true
          echo "==> Backend deployment completed!"
          pm2 status
        ENDSSH

    - name: Deploy Frontend (Private Subnet)
      run: |
        echo "=========================================="
        echo "Deploying Frontend EC2 via Bastion Host"
        echo "=========================================="
        
        ssh -J ubuntu@${{ secrets.EC2_BASTION_HOST }} ubuntu@${{ secrets.EC2_FRONTEND_HOST }} << 'ENDSSH'
          set -e
          
          # Fresh checkout or git pull
          if [ ! -d "${{ env.DEPLOY_PATH }}" ]; then
            echo "Cloning repository..."
            git clone https://github.com/${{ github.repository }}.git ${{ env.DEPLOY_PATH }}
          else
            echo "Updating remote origin to user repository..."
            cd ${{ env.DEPLOY_PATH }}
            git remote set-url origin https://github.com/${{ github.repository }}.git || true
            echo "Updating repository..."
            git fetch origin
            git reset --hard origin/main
          fi
          
          # Force ownership to ubuntu user to prevent EACCES permission errors
          sudo chown -R ubuntu:ubuntu ${{ env.DEPLOY_PATH }}
          
          cd ${{ env.DEPLOY_PATH }}/src/frontend
          
          # Install dependencies and build React app
          echo "Installing dependencies..."
          npm install
          
          echo "Building production bundles..."
          npm run build
          
          # Deploy files to Nginx web root
          echo "Copying distribution bundles to Nginx root..."
          sudo rm -rf ${{ env.FRONTEND_DEPLOY_PATH }}/*
          sudo cp -r dist/* ${{ env.FRONTEND_DEPLOY_PATH }}/
          sudo chown -R www-data:www-data ${{ env.FRONTEND_DEPLOY_PATH }}
          
          # Restart Nginx
          echo "Reloading Nginx web server..."
          sudo systemctl reload nginx
          
          echo "Frontend deployment completed!"
        ENDSSH

    - name: Automatically Deploy Grafana & Prometheus Stack (Bastion Host)
      run: |
        echo "=========================================="
        echo "Deploying Telemetry Stack on Bastion Host"
        echo "=========================================="
        ssh ubuntu@${{ secrets.EC2_BASTION_HOST }} \
          SMTP_SMARTHOST="${{ secrets.SMTP_SMARTHOST }}" \
          SMTP_FROM="${{ secrets.SMTP_FROM }}" \
          SMTP_AUTH_USERNAME="${{ secrets.SMTP_AUTH_USERNAME }}" \
          SMTP_AUTH_PASSWORD="${{ secrets.SMTP_AUTH_PASSWORD }}" \
          ALERT_EMAIL_TO="${{ secrets.ALERT_EMAIL_TO }}" \
          bash -s << 'ENDSSH'
          set -e
          
          # Fresh clone or update
          if [ ! -d "/home/ubuntu/bmi-health-tracker" ]; then
            echo "Cloning repository..."
            git clone https://github.com/${{ github.repository }}.git /home/ubuntu/bmi-health-tracker
          else
            echo "Updating remote origin to user repository..."
            cd /home/ubuntu/bmi-health-tracker
            git remote set-url origin https://github.com/${{ github.repository }}.git || true
            echo "Updating repository..."
            git fetch origin
            git reset --hard origin/main
          fi
          
          cd /home/ubuntu/bmi-health-tracker
          sudo chmod +x monitoring/3-tier-app/scripts/setup-monitoring-server.sh
          
          # Pass the backend host IP non-interactively to the script
          export SMTP_SMARTHOST
          export SMTP_FROM
          export SMTP_AUTH_USERNAME
          export SMTP_AUTH_PASSWORD
          export ALERT_EMAIL_TO
          echo "${{ secrets.EC2_BACKEND_HOST }}" | sudo -E ./monitoring/3-tier-app/scripts/setup-monitoring-server.sh
          
          echo "Monitoring stack setup complete!"
        ENDSSH

    - name: Automatically Setup Exporters (Backend Private Node)
      run: |
        echo "=========================================="
        echo "Deploying Exporters on Private Backend Node"
        echo "=========================================="
        ssh -J ubuntu@${{ secrets.EC2_BASTION_HOST }} ubuntu@${{ secrets.EC2_BACKEND_HOST }} << 'ENDSSH'
          set -e
          
          # Force sync latest files
          cd /home/ubuntu/bmi-health-tracker
          sudo chmod +x monitoring/3-tier-app/scripts/setup-application-server.sh
          
          # Pass the Bastion private IP (which we fetch dynamically) to the exporter installer
          BASTION_PRIVATE_IP=$(host -t A ${{ secrets.EC2_BASTION_HOST }} 2>/dev/null | awk '{print $4}' || echo "10.0.1.10")
          # Under custom VPC networking, Bastion private IP resides in 10.0.1.x subnet, let's fetch it from system configuration or default
          # Actually, the Bastion host private IP is usually the default gateway or 10.0.1.10
          # We can pass a generic CIDR block or Bastion private IP: 10.0.1.0/24 range.
          # The exporter setup script prompts: "Monitoring Server IP: "
          # We pass "10.0.1.0/24" or a generic private address. Let's send the VPC CIDR 10.0.0.0/16 so it accepts any VPC monitoring connections!
          echo "10.0.0.0/16" | sudo ./monitoring/3-tier-app/scripts/setup-application-server.sh
          
          echo "Exporters setup complete!"
        ENDSSH

    - name: Health Check (Verify via Load Balancer)
      run: |
        echo "=========================================="
        echo "Performing App Verification via ALB"
        echo "=========================================="
        echo "ALB DNS: ${{ secrets.ALB_DNS_NAME }}"
        echo "Waiting up to 5 minutes for ALB target registration..."
        
        HTTP_STATUS="000"
        for i in {1..20}; do
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 10 --max-time 15 \
            "http://${{ secrets.ALB_DNS_NAME }}/health" 2>/dev/null || true)
          [ -z "$HTTP_STATUS" ] && HTTP_STATUS="000"
          echo "Attempt $i/20: HTTP $HTTP_STATUS"
          [ "$HTTP_STATUS" = "200" ] && break
          sleep 15
        done
        
        if [ "$HTTP_STATUS" = "200" ]; then
          echo "✅ SUCCESS: Application is live at http://${{ secrets.ALB_DNS_NAME }}"
        else
          echo "⚠️  WARNING: ALB health check returned $HTTP_STATUS after 20 attempts."
          echo "   The application may still be starting up."
          echo "   Manually verify: curl http://${{ secrets.ALB_DNS_NAME }}/health"
          echo "   This step is non-fatal — deployment continues."
        fi

    - name: Print Debug Logs on Failure
      if: failure()
      run: |
        echo "=========================================="
        echo "DEPLOYMENT FAILED: Fetching Remote Logs..."
        echo "=========================================="
        echo "--- Backend PM2 Status & Logs ---"
        ssh -J ubuntu@${{ secrets.EC2_BASTION_HOST }} ubuntu@${{ secrets.EC2_BACKEND_HOST }} \
          "export PM2_HOME=/home/ubuntu/.pm2; pm2 status; echo '--- OUT LOG ---'; tail -80 /home/ubuntu/bmi-health-tracker/src/backend/logs/out.log 2>/dev/null || tail -80 /home/ubuntu/bmi-health-tracker/backend/logs/out.log 2>/dev/null; echo '--- ERR LOG ---'; tail -80 /home/ubuntu/bmi-health-tracker/src/backend/logs/err.log 2>/dev/null || tail -80 /home/ubuntu/bmi-health-tracker/backend/logs/err.log 2>/dev/null" || true
        echo "--- Frontend Nginx Status & Logs ---"
        ssh -J ubuntu@${{ secrets.EC2_BASTION_HOST }} ubuntu@${{ secrets.EC2_FRONTEND_HOST }} "sudo systemctl status nginx; sudo tail -n 50 /var/log/nginx/error.log" || true
